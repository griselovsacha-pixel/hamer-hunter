version: '3.8'
services:
  redis:
    image: redis:alpine
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "8000:8000"
    depends_on:
      - redis
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    depends_on:
      - redis
    environment:
      - SHODAN_API_KEY=${SHODAN_API_KEY}
      - HUNTER_API_KEY=${HUNTER_API_KEY}
  proxy:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      - redis
